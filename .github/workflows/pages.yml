# Đưa web lên GitHub Pages mỗi khi push lên nhánh main.
# Chỉ các file web dưới đây được đăng; build.py, *.md, *.gs... nằm trong repo nhưng không thành trang web.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gom file web vào _site
        run: |
          mkdir _site
          cp *.html projects.js _site/
          cp -r assets data img _site/
          for f in sitemap.xml robots.txt CNAME favicon.ico; do [ -f "$f" ] && cp "$f" _site/ || true; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
